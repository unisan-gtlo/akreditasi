# =====================================================================
# nginx — siakred.unisan.ac.id (portal resmi kampus)
#
# Sesuaikan 3 hal sebelum dipakai:
#   1. upstream  -> alamat gunicorn (127.0.0.1:8000 atau unix socket)
#   2. ssl_certificate / ssl_certificate_key
#   3. path STATIC_ROOT & MEDIA_ROOT (/var/www/siakred/...)
#
# Cek & terapkan:  nginx -t && systemctl reload nginx
# =====================================================================

upstream siakred_app {
    server 127.0.0.1:8000;          # atau: server unix:/run/siakred/gunicorn.sock;
    keepalive 16;                   # koneksi nginx->gunicorn dipakai ulang
}

server {
    listen 80;
    listen [::]:80;
    server_name siakred.unisan.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;           # HTTP/2: banyak file paralel dalam 1 koneksi
    listen [::]:443 ssl http2;
    server_name siakred.unisan.ac.id;

    server_tokens off;              # sembunyikan "nginx/1.14.1"

    # ---------- TLS ----------
    ssl_certificate     /etc/letsencrypt/live/siakred.unisan.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siakred.unisan.ac.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Resume sesi TLS: kunjungan berikutnya tanpa handshake penuh
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling: browser tidak perlu cek sertifikat ke CA sendiri
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---------- Header keamanan (samakan dengan siakred.unisan-g.id) ----------
    # PENTING: add_header di dalam location MENIMPA semua add_header di sini,
    # jadi location yang punya add_header sendiri meng-include file ini lagi.
    include /etc/nginx/snippets/siakred-security-headers.conf;

    # ---------- Kompresi ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml;

    client_max_body_size 55m;       # MAX_UPLOAD_SIZE_MB=50 + overhead form

    # ---------- Static ----------
    # File ber-hash dari collectstatic (siakred.4ab244b9775f.css): tidak
    # pernah berubah isinya -> cache 1 tahun, browser tidak perlu cek ulang.
    location ~* "^/static/(.+\.[0-9a-f]{12}\.[a-z0-9]+)$" {
        alias /var/www/siakred/staticfiles/$1;   # = STATIC_ROOT
        gzip_static on;             # pakai .gz yang dibuat WhiteNoise
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/siakred-security-headers.conf;
        access_log off;
    }
    location /static/ {
        alias /var/www/siakred/staticfiles/;
        gzip_static on;
        expires 7d;
        access_log off;
    }

    # ---------- Media ----------
    location /media/profile/ {
        alias /var/www/siakred/media/profile/;
        expires 7d;
        access_log off;
    }
    location /media/ {
        alias /var/www/siakred/media/;
        expires 1d;
    }

    # ---------- Aplikasi Django ----------
    location / {
        proxy_pass http://siakred_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # export laporan / ZIP bundle bisa lama
        proxy_buffering on;
    }
}
